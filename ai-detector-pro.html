<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Authenticator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .version {
            font-size: 0.85rem;
            color: #38bdf8;
        }
        .title-badge {
            font-size: 1.25rem;
            font-weight: bold;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(145deg, #131c31, #0f172a);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: auto 0;
        }
        h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        p.desc {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .upload-box {
            border: 2px dashed rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            padding: 40px 20px;
            background: rgba(15, 23, 42, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-box:hover {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.6);
        }
        .upload-box p {
            color: #cbd5e1;
            margin-top: 15px;
            font-size: 0.95rem;
        }
        .formats {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 8px;
        }
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="version">v1.0 Neural Core</div>
        <div class="title-badge">AI Image Authenticator 🛡️</div>
    </div>

    <div class="container">
        <h1>كشف الصور المولدة بالذكاء الاصطناعي</h1>
        <p class="desc">تحليل عميق لأنماط التردد، العيوب البصرية، والبيكسلات للتمييز بين الصور الحقيقية وتوليد الـ AI</p>
        
        <div class="upload-box">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <p>انقر هنا لرفع الصورة أو سحبها وإفلاتها هنا</p>
            <div class="formats">JPG, PNG, WEBP دعم صيغ</div>
        </div>
    </div>

    <footer>
        تصميم وتطوير قصي كاظم منديل - 2026 - نظام الفحص الذكي
    </footer>

</body>
</html>
