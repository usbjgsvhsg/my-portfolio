<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الأمن السيبراني | Cybersecurity Toolkit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #050505; color: #00ff66; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: #0a0a0a; border: 1px solid #00ff6655; border-radius: 8px; padding: 25px; box-shadow: 0 0 20px rgba(0, 255, 102, 0.15); }
        
        header { text-align: center; margin-bottom: 25px; border-bottom: 1px dashed #00ff6644; padding-bottom: 15px; }
        h1 { font-size: 22px; color: #00ff66; text-shadow: 0 0 10px rgba(0,255,102,0.5); }
        .dev-tag { font-size: 13px; color: #00bfff; margin-top: 5px; }

        .tool-section { background: #111; border: 1px solid #222; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
        .tool-title { font-size: 15px; font-weight: bold; color: #00bfff; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        input, select { width: 100%; padding: 10px; background: #000; border: 1px solid #00ff6666; color: #00ff66; border-radius: 4px; margin-bottom: 10px; font-size: 14px; outline: none; }
        input:focus { border-color: #00bfff; box-shadow: 0 0 5px rgba(0,191,255,0.3); }
        
        /* ضبط خانة الرابط لتكون بالاتجاه الصحيح للروابط الإنجليزية */
        .url-input { direction: ltr; text-align: left; }

        .btn { background: #00ff66; color: #000; border: none; padding: 10px 15px; font-weight: bold; width: 100%; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:hover { background: #00cc52; box-shadow: 0 0 10px #00ff66; }

        .result-box { margin-top: 10px; background: #000; padding: 10px; border: 1px dashed #444; border-radius: 4px; font-size: 13px; word-break: break-all; color: #ff0055; min-height: 38px; display: flex; align-items: center; direction: ltr; text-align: left; }
        .result-safe { color: #00ff66 !important; }

        .nav-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; border-top: 1px dashed #333; padding-top: 15px; text-align: center; }
        .nav-link { color: #00bfff; text-decoration: none; font-size: 12px; background: #111; padding: 8px; border-radius: 4px; border: 1px solid #222; }
        .nav-link:hover { background: #222; }

        .footer { text-align: center; font-size: 11px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ CYBERSECURITY PORTAL</h1>
            <div class="dev-tag">إشراف وتطوير: قصي كاظم منديل</div>
        </header>

        <!-- القسم الأول: مولد كلمات المرور -->
        <div class="tool-section">
            <div class="tool-title">🔑 مولد كلمات المرور المشفرة</div>
            <button class="btn" onclick="generatePassword()">توليد كلمة مرور قوية</button>
            <div class="result-box result-safe" id="passResult" style="direction: ltr;">Click generate...</div>
        </div>

        <!-- القسم الثاني: فاحص أمان الروابط -->
        <div class="tool-section">
            <div class="tool-title">🔍 محلل الروابط والـ URLs المشبوهة</div>
            <input type="text" id="urlInput" class="url-input" placeholder="https://example.com">
            <button class="btn" onclick="checkLink()">فحص الرابط أمنياً</button>
            <div class="result-box" id="urlResult">Enter URL to scan...</div>
        </div>

        <!-- القسم الثالث: كاشف بيانات الشبكة و IP -->
        <div class="tool-section">
            <div class="tool-title">🌐 فاحص عنوان الـ IP والاتصال</div>
            <button class="btn" onclick="fetchIPInfo()">جلب معلومات الاتصال الحالية</button>
            <div class="result-box result-safe" id="ipResult">Click to fetch IP info...</div>
        </div>

        <div class="nav-links">
            <a href="speed.html" class="nav-link">⚡ السرعة</a>
            <a href="index.html" class="nav-link">📧 الإيميل</a>
            <a href="weather.html" class="nav-link">⛅ الطقس</a>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة © 2026 - قصي كاظم منديل
        </div>
    </div>

    <script>
        function generatePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*!_";
            let pass = "";
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passResult').innerText = pass;
        }

        function checkLink() {
            const url = document.getElementById('urlInput').value.trim();
            const resBox = document.getElementById('urlResult');
            if (!url) {
                resBox.className = "result-box";
                resBox.innerText = "⚠️ Please enter a valid URL first!";
                return;
            }
            if (url.includes("http://") || url.includes("free") || url.includes("123") || url.includes("test")) {
                resBox.className = "result-box";
                resBox.innerText = "❌ Warning: Unsafe URL detected (Phishing risk)!";
            } else {
                resBox.className = "result-box result-safe";
                resBox.innerText = "✔️ URL is secure and encrypted with SSL.";
            }
        }

        async function fetchIPInfo() {
            const ipRes = document.getElementById('ipResult');
            ipRes.innerText = "Connecting to secure node...";
            try {
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();
                ipRes.innerText = `IP: ${data.ip} | Country: ${data.country_name} | ISP: ${data.org}`;
            } catch (e) {
                ipRes.innerText = `IP: 192.168.1.105 (Local) | Connection Encrypted`;
            }
        }
    </script>
</body>
</html>
