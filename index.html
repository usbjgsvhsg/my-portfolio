<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة فحص الإيميلات | Email Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-align: center;
        }
        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔍 أداة فحص البريد الإلكتروني</h1>
        <p class="subtitle">أدخل البريد للتحقق من صحته وتفاصيله الأولية</p>
        
        <div class="input-group">
            <label for="emailInput">البريد الإلكتروني:</label>
            <input type="email" id="emailInput" placeholder="example@domain.com">
        </div>
        
        <button onclick="checkEmail()">بدء الفحص</button>
        
        <div id="result"></div>
    </div>

    <script>
        function checkEmail() {
            const email = document.getElementById('emailInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if(!email || !email.includes('@')) {
                resultDiv.style.display = 'block';
                resultDiv.style.color = '#f87171';
                resultDiv.innerHTML = '⚠️ الرجاء إدخال بريد إلكتروني صحيح!';
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.style.color = '#f8fafc';
            resultDiv.innerHTML = '<div class="loading">جاري فحص الإيميل والاتصال بالسيرفرات...</div>';

            setTimeout(() => {
                const domain = email.split('@')[1];
                resultDiv.innerHTML = `
                    <b style="color: #38bdf8;">نتائج الفحص لـ:</b> ${email}<br><br>
                    - الدومين: <b>${domain}</b><br>
                    - الصيغة: <span style="color: #4ade80;">صحيحة وفعالة</span><br>
                    - الحالة الأمنية: <span style="color: #4ade80;">غير مسرب في القواعد الوهمية (محاكاة)</span>
                `;
            }, 1500);
        }
    </script>

</body>
</html>
