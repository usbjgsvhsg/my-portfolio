<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية - Cyber Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #050505;
            color: #00ff66;
            padding: 20px;
            direction: rtl;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #0d0d0d;
            border: 1px solid #00ff6644;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15);
            text-align: center;
        }
        h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #00ffaa;
            text-shadow: 0 0 10px #00ff66;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 25px;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-card {
            background: #000;
            border: 1px solid #00ff6666;
            border-radius: 8px;
            padding: 15px;
            text-decoration: none;
            color: #00ff66;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s;
        }
        .menu-card:hover {
            background: #00ff6611;
            border-color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            transform: translateY(-2px);
        }
        .card-info {
            text-align: right;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 3px;
        }
        .card-desc {
            font-size: 0.75rem;
            color: #aaa;
        }
        .card-icon {
            font-size: 1.5rem;
        }
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #555;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚡ Cyber Operations Hub</h2>
        <div class="subtitle">لوحة التحكم والأدوات المركزية</div>

        <div class="menu-grid">
            <a href="weather.html" class="menu-card">
                <div class="card-info">
                    <div class="card-title">Weather Hub</div>
                    <div class="card-desc">تتبع حالة الطقس والرياح لحظياً</div>
                </div>
                <div class="card-icon">🌡️</div>
            </a>

            <a href="vehicle.html" class="menu-card">
                <div class="card-info">
                    <div class="card-title">Vehicle Maintenance Tracker</div>
                    <div class="card-desc">سجل صيانة المركبات وعداد الكيلومتر</div>
                </div>
                <div class="card-icon">🛠️</div>
            </a>
        </div>
    </div>

    <div class="footer">
        إشراف وتطوير: قصي كاظم منديل © 2026
    </div>

</body>
</html>
