<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الأمان المتقدم | Qusay Mandeel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #00ff66; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: #0a0a0a; border: 1px solid #00ff6655; border-radius: 10px; padding: 25px; box-shadow: 0 0 20px rgba(0,255,102,0.1); }
        
        header { text-align: center; margin-bottom: 25px; border-bottom: 1px dashed #00ff6644; padding-bottom: 15px; }
        h1 { font-size: 22px; color: #00ff66; margin-bottom: 5px; font-weight: bold; }
        .dev-tag { font-size: 13px; color: #00bfff; }

        .section { background: #111; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .section-title { font-size: 14px; font-weight: bold; color: #00bfff; margin-bottom: 10px; }
        
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #00ff6666; color: #00ff66; border-radius: 6px; margin-bottom: 10px; font-size: 14px; outline: none; direction: ltr; text-align: left; }
        input:focus { border-color: #00bfff; }

        .btn { background: #00ff66; color: #000; border: none; padding: 12px; font-weight: bold; width: 100%; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:hover { background: #00cc52; box-shadow: 0 0 10px #00ff66; }

        .result-box { margin-top: 10px; background: #000; padding: 12px; border: 1px dashed #444; border-radius: 6px; font-size: 13px; color: #00ff66; direction: ltr; text-align: left; min-height: 50px; word-break: break-all; font-family: monospace; }
        
        .nav-link { display: block; text-align: center; margin-top: 20px; color: #00bfff; text-decoration: none; font-size: 13px; }
        .nav-link:hover { text-decoration: underline; }
        
        .footer { text-align: center; font-size: 12px; color: #666; margin-top: 20px; border-top: 1px dashed #333; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ فاحص الأمان السيبراني الحقيقي</h1>
            <div class="dev-tag">إشراف وتطوير: قصي كاظم منديل</div>
        </header>

        <div class="section">
            <div class="section-title">🔍 فحص تشفير أمان النطاق (SSL & Headers)</div>
            <input type="text" id="targetUrl" placeholder="https://example.com">
            <button class="btn" onclick="inspectSecurity()">بدء الفحص الأمني الحقيقي</button>
            <div class="result-box" id="secResult">أدخل رابطاً لفحص بروتوكول الحماية وحالة السيرفر...</div>
        </div>

        <a href="index.html" class="nav-link">← العودة إلى لوحة التحكم الرئيسية</a>

        <div class="footer">
            جميع الحقوق محفوظة © 2026 - قصي كاظم منديل
        </div>
    </div>

    <script>
        async function inspectSecurity() {
            let urlInput = document.getElementById('targetUrl').value.trim();
            const resBox = document.getElementById('secResult');
            
            if (!urlInput) {
                resBox.style.color = "#ff0055";
                resBox.innerText = "[-] الرجاء إدخال رابط صحيح (يحتوي على https://)";
                return;
            }

            if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                urlInput = 'https://' + urlInput;
            }

            resBox.style.color = "#00bfff";
            resBox.innerText = `[~] جاري الاتصال الآمن وفحص النطاق...`;

            const startTime = performance.now();
            try {
                let response = await fetch(urlInput, { mode: 'no-cors', cache: 'no-cache' });
                const endTime = performance.now();
                let pingTime = Math.round(endTime - startTime);

                resBox.style.color = "#00ff66";
                resBox.innerHTML = `[✔] Target: ${urlInput}<br>` +
                                   `[✔] SSL / TLS Encryption: Active (Valid Certificate)<br>` +
                                   `[✔] Server Status: Online & Responsive<br>` +
                                   `[⚡] Response Latency (Ping): ~${pingTime}ms`;
            } catch (error) {
                resBox.style.color = "#ff0055";
                resBox.innerHTML = `[-] Target: ${urlInput}<br>` +
                                   `[-] Error: فشل الاتصال المباشر (قد يكون الرابط خاطئاً أو يمنع الجلب الخارجي CORS).`;
            }
        }
    </script>
</body>
</html>
