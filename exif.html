<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستخرج بيانات الصور | Qusay Mandeel</title>
    <!-- مكتبة قراءة بيانات EXIF الحقيقية للصور -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050505; color: #00ff66; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: #0a0a0a; border: 1px solid #00ff6655; border-radius: 10px; padding: 25px; box-shadow: 0 0 20px rgba(0,255,102,0.1); }
        
        header { text-align: center; margin-bottom: 25px; border-bottom: 1px dashed #00ff6644; padding-bottom: 15px; }
        h1 { font-size: 20px; color: #00ff66; margin-bottom: 5px; font-weight: bold; }
        .dev-tag { font-size: 13px; color: #00bfff; }

        .section { background: #111; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .section-title { font-size: 14px; font-weight: bold; color: #00bfff; margin-bottom: 10px; }
        
        input[type="file"] { width: 100%; padding: 10px; background: #000; border: 1px solid #00ff6666; color: #00ff66; border-radius: 6px; margin-bottom: 10px; font-size: 13px; cursor: pointer; }

        .preview-img { max-width: 100%; max-height: 200px; display: block; margin: 10px auto; border-radius: 6px; border: 1px solid #333; }

        .result-box { margin-top: 10px; background: #000; padding: 12px; border: 1px dashed #444; border-radius: 6px; font-size: 13px; color: #00ff66; direction: ltr; text-align: left; min-height: 80px; word-break: break-all; font-family: monospace; }
        
        .nav-link { display: block; text-align: center; margin-top: 20px; color: #00bfff; text-decoration: none; font-size: 13px; }
        .nav-link:hover { text-decoration: underline; }
        
        .footer { text-align: center; font-size: 12px; color: #666; margin-top: 20px; border-top: 1px dashed #333; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 محلل ومستخرج بيانات الصور (EXIF)</h1>
            <div class="dev-tag">إشراف وتطوير: قصي كاظم منديل</div>
        </header>

        <div class="section">
            <div class="section-title">📁 اختر صورة لفحص بياناتها المخفية</div>
            <input type="file" id="imageInput" accept="image/*" onchange="extractExifData(event)">
            <img id="imagePreview" class="preview-img" style="display:none;" alt="معاينة الصورة">
            <div class="result-box" id="exifResult">قم برفع صورة لعرض تفاصيلها التقنية وبيانات الـ EXIF...</div>
        </div>

        <a href="index.html" class="nav-link">← العودة إلى الصفحة الرئيسية</a>

        <div class="footer">
            جميع الحقوق محفوظة © 2026 - قصي كاظم منديل
        </div>
    </div>

    <script>
        function extractExifData(event) {
            const file = event.target.files[0];
            const resBox = document.getElementById('exifResult');
            const preview = document.getElementById('imagePreview');

            if (!file) return;

            // عرض معاينة للصورة
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";

            resBox.style.color = "#00bfff";
            resBox.innerText = "[~] جاري قراءة واستخراج البيانات المخفية من الصورة...";

            EXIF.getData(file, function() {
                let allData = EXIF.getAllTags(this);
                
                if (allData && Object.keys(allData).length > 0) {
                    let make = EXIF.getTag(this, "Make") || "غير معروف";
                    let model = EXIF.getTag(this, "Model") || "غير معروف";
                    let dateTime = EXIF.getTag(this, "DateTime") || "غير متوفر";
                    let iso = EXIF.getTag(this, "ISOSpeedRatings") || "غير متوفر";
                    let aperture = EXIF.getTag(this, "FNumber") ? "f/" + EXIF.getTag(this, "FNumber") : "غير متوفر";

                    resBox.style.color = "#00ff66";
                    resBox.innerHTML = `[✔] File Name: ${file.name}<br>` +
                                       `[✔] File Size: ${(file.size / 1024).toFixed(2)} KB<br>` +
                                       `[✔] Camera Make: ${make}<br>` +
                                       `[✔] Camera Model: ${model}<br>` +
                                       `[✔] Date Taken: ${dateTime}<br>` +
                                       `[✔] ISO Speed: ${iso}<br>` +
                                       `[✔] Aperture: ${aperture}`;
                } else {
                    resBox.style.color = "#ff0055";
                    resBox.innerHTML = `[!] File Name: ${file.name}<br>` +
                                       `[!] File Size: ${(file.size / 1024).toFixed(2)} KB<br>` +
                                       `[-] ملاحظة: هذه الصورة لا تحتوي على بيانات EXIF مخفية (ربما تم حذفها بواسطة تطبيق مراسلة أو وسائط اجتماعية).`;
                }
            });
        }
    </script>
</body>
</html>
