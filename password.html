<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد كلمات المرور الآمنة | Password Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); width: 100%; max-width: 480px; border: 1px solid #334155; }
        h1 { font-size: 22px; margin-bottom: 5px; color: #38bdf8; text-align: center; }
        .developer-tag { text-align: center; font-size: 13px; color: #38bdf8; margin-bottom: 15px; font-weight: 600; }
        p.subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 25px; }
        
        .display-box { background-color: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .password-text { font-family: monospace; font-size: 16px; color: #4ade80; word-break: break-all; }
        
        .options-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; font-size: 14px; color: #cbd5e1; }
        .option-row { display: flex; justify-content: space-between; align-items: center; }
        input[type="range"] { width: 60%; accent-color: #38bdf8; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #0284c7; cursor: pointer; }

        button.gen-btn { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        button.gen-btn:hover { background-color: #0369a1; }
        
        button.copy-btn { width: 100%; padding: 10px; background-color: #059669; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button.copy-btn:hover { background-color: #047857; }

        .nav-links { display: flex; justify-content: space-between; margin-top: 20px; font-size: 13px; border-top: 1px solid #334155; padding-top: 15px; }
        .nav-link { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .nav-link:hover { text-decoration: underline; }
        
        .footer { text-align: center; margin-top: 15px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>مولد كلمات المرور الآمنة 🔐</h1>
        <div class="developer-tag">تطوير: قصي كاظم منديل</div>
        <p class="subtitle>أنشئ كلمات مرور قوية ومعقدة لحماية حساباتك الشخصية</p>
        
        <div class="display-box">
            <span id="passwordDisplay" class="password-text">انقر على توليد</span>
        </div>

        <div class="options-group">
            <div class="option-row">
                <span>الطول: <span id="lengthVal">12</span></span>
                <input type="range" id="lengthRange" min="6" max="32" value="12" oninput="document.getElementById('lengthVal').innerText = this.value; generatePassword();">
            </div>
            <label class="checkbox-label">
                <input type="checkbox" id="uppercase" checked onchange="generatePassword()"> حروف كبيرة (A-Z)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="lowercase" checked onchange="generatePassword()"> حروف صغيرة (a-z)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="numbers" checked onchange="generatePassword()"> أرقام (0-9)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="symbols" checked onchange="generatePassword()"> رموز خاصّة (!@#$...)
            </label>
        </div>
        
        <button class="gen-btn" onclick="generatePassword()">توليد كلمة مرور جديدة ⚡</button>
        <button class="copy-btn" onclick="copyPassword()">📋 نسخ كلمة المرور</button>

        <div class="nav-links">
            <a href="index.html" class="nav-link">⬅️ فحص الإيميل</a>
            <a href="counter.html" class="nav-link">⏱️ العدادات</a>
        </div>
        
        <div class="footer">
            جميع الحقوق محفوظة © 2026 - قصي كاظم منديل
        </div>
    </div>

    <script>
        const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowerChars = "abcdefghijklmnopqrstuvwxyz";
        const numberChars = "0123456789";
        const symbolChars = "!@#$%^&*()_+-=[]{}|;:,.<>?";

        function generatePassword() {
            let chars = "";
            if (document.getElementById('uppercase').checked) chars += upperChars;
            if (document.getElementById('lowercase').checked) chars += lowerChars;
            if (document.getElementById('numbers').checked) chars += numberChars;
            if (document.getElementById('symbols').checked) chars += symbolChars;

            const length = document.getElementById('lengthRange').value;
            const display = document.getElementById('passwordDisplay');

            if (chars === "") {
                display.innerText = "الرجاء اختيار خيار واحد على الأقل!";
                display.style.color = "#f87171";
                return;
            }

            display.style.color = "#4ade80";
            let password = "";
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }
            display.innerText = password;
        }

        function copyPassword() {
            const password = document.getElementById('passwordDisplay').innerText;
            if (password.includes("الرجاء") || password === "انقر على توليد") return;

            navigator.clipboard.writeText(password).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '✅ تم النسخ بنجاح!';
                copyBtn.style.backgroundColor = '#047857';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.style.backgroundColor = '#059669';
                }, 2000);
            });
        }

        // توليد كلمة مرور أولية عند فتح الصفحة
        generatePassword();
    </script>
</body>
</html>
