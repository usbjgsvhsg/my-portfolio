<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر الدقيقة | Age Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); width: 100%; max-width: 520px; border: 1px solid #334155; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 5px; color: #38bdf8; }
        .developer-tag { font-size: 13px; color: #38bdf8; margin-bottom: 15px; font-weight: 600; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }

        .input-group { margin-bottom: 20px; text-align: right; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        input[type="date"] { width: 100%; background-color: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; outline-color: #38bdf8; color-scheme: dark; }
        
        .calc-btn { background-color: #0284c7; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .calc-btn:hover { background-color: #0369a1; }

        .result-box { margin-top: 25px; background-color: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 20px; display: none; text-align: center; }
        .result-box.active { display: block; }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .result-item { background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        .result-num { font-size: 20px; font-weight: bold; color: #4ade80; }
        .result-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }

        .nav-links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 25px; font-size: 11px; border-top: 1px solid #334155; padding-top: 15px; text-align: center; }
        .nav-link { color: #38bdf8; text-decoration: none; font-weight: 600; background: #0f172a; padding: 8px 4px; border-radius: 6px; border: 1px solid #334155; transition: background 0.2s; }
        .nav-link:hover { background: #1e293b; border-color: #38bdf8; }
        
        .footer { text-align: center; margin-top: 15px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>حاسبة العمر الدقيقة ⏳</h1>
        <div class="developer-tag">إشراف وتطوير: قصي كاظم منديل</div>
        <p class="subtitle">احسب عمرك بالتفصيل الدقيق بالسنين، الأشهر، والأيام</p>
        
        <div class="input-group">
            <label for="birthDate">أدخل تاريخ ميلادك:</label>
            <input type="date" id="birthDate">
        </div>

        <button class="calc-btn" onclick="calculateAge()">احسب العمر</button>

        <div class="result-box" id="resultBox">
            <div style="font-size: 14px; color: #38bdf8; font-weight: bold; margin-bottom: 5px;">عمرك الحالي هو:</div>
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-num" id="yearsVal">0</div>
                    <div class="result-label">سنة</div>
                </div>
                <div class="result-item">
                    <div class="result-num" id="monthsVal">0</div>
                    <div class="result-label">شهر</div>
                </div>
                <div class="result-item">
                    <div class="result-num" id="daysVal">0</div>
                    <div class="result-label">يوم</div>
                </div>
            </div>
        </div>

        <div class="nav-links">
            <a href="index.html" class="nav-link">فحص الإيميل</a>
            <a href="weather.html" class="nav-link">الطقس</a>
            <a href="islamic.html" class="nav-link">الأذكار</a>
            <a href="cyber.html" class="nav-link">الأمن</a>
        </div>
        
        <div class="footer">
            جميع الحقوق محفوظة © 2026 - قصي كاظم منديل
        </div>
    </div>

    <script>
        function calculateAge() {
            const birthInput = document.getElementById('birthDate').value;
            if (!birthInput) return;

            const birthDate = new Date(birthInput);
            const today = new Date();

            if (birthDate > today) {
                alert('تاريخ الميلاد المدخل غير صحيح (في المستقبل)!');
                return;
            }

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                // الحصول على عدد الأيام في الشهر السابق
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('yearsVal').innerText = years;
            document.getElementById('monthsVal').innerText = months;
            document.getElementById('daysVal').innerText = days;
            
            document.getElementById('resultBox').classList.add('active');
        }
    </script>
</body>
</html>
