<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة سرعة الإنترنت | Speed Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); width: 100%; max-width: 520px; border: 1px solid #334155; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 5px; color: #38bdf8; }
        .developer-tag { font-size: 13px; color: #38bdf8; margin-bottom: 15px; font-weight: 600; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }

        .speed-display { background-color: #0f172a; border: 1px solid #334155; border-radius: 50%; width: 160px; height: 160px; margin: 0 auto 25px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; border-top: 4px solid #38bdf8; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .speed-num { font-size: 32px; font-weight: bold; color: #4ade80; }
        .speed-unit { font-size: 12px; color: #94a3b8; margin-top: 4px; }

        .test-btn { background-color: #0284c7; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .test-btn:hover { background-color: #0369a1; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; text-align: right; }
        .info-card { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; font-size: 13px; color: #94a3b8; }
        .info-val { color: #f8fafc; font-weight: bold; margin-top: 4px; }

        .nav-links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 25px; font-size: 11px; border-top: 1px solid #334155; padding-top: 15px; text-align: center; }
        .nav-link { color: #38bdf8; text-decoration: none; font-weight: 600; background: #0f172a; padding: 8px 4px; border-radius: 6px; border: 1px solid #334155; transition: background 0.2s; }
        .nav-link:hover { background: #1e293b; border-color: #38bdf8; }
        
        .footer { text-align: center; margin-top: 15px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>محطة سرعة الإنترنت ⚡</h1>
        <div class="developer-tag">إشراف وتطوير: قصي كاظم منديل</div>
        <p class="subtitle">قياس كفاءة استجابة الشبكة وسرعة الاتصال</p>
        
        <div class="speed-display">
            <div class="speed-num" id="pingVal">--</div>
            <div class="speed-unit">مللي ثانية (Ping)</div>
        </div>

        <button class="test-btn" onclick="startSpeedTest()">بدء الفحص الآن</button>

        <div class="info-grid">
            <div class="info-card">
                <div>حالة الاتصال:</div>
                <div class="info-val" id="statusVal">جاهز للفحص</div>
            </div>
            <div class="info-card">
                <div>نوع الشبكة:</div>
                <div class="info-val" id="netType">غير محدد</div>
            </div>
        </div>

        <div class="nav-links">
            <a href="index.html" class="nav-link">فحص الإيميل</a>
            <a href="weather.html" class="nav-link">الطقس</a>
            <a href="age.html" class="nav-link">العمر</a>
            <a href="cyber.html" class="nav-link">الأمن</a>
        </div>
        
        <div class="footer">
            جميع الحقوق محفوظة © 2026 - قصي كاظم منديل
        </div>
    </div>

    <script>
        async function startSpeedTest() {
            const pingDisplay = document.getElementById('pingVal');
            const statusDisplay = document.getElementById('statusVal');
            const netTypeDisplay = document.getElementById('netType');
            
            pingDisplay.innerText = '...';
            statusDisplay.innerText = 'جاري قياس البنق...';

            const startTime = new Date().getTime();
            try {
                // طلب خفيف لقياس زمن الاستجابة الحقيقي
                await fetch('https://www.cloudflare.com/cdn-cgi/trace', { mode: 'no-cors' });
                const endTime = new Date().getTime();
                const duration = endTime - startTime;

                pingDisplay.innerText = duration;
                statusDisplay.innerText = 'متصل بنجاح ممتاز';
                
                if (navigator.connection) {
                    netTypeDisplay.innerText = navigator.connection.effectiveType ? navigator.connection.effectiveType.toUpperCase() : 'غير متوفر';
                } else {
                    netTypeDisplay.innerText = 'عادي';
                }
            } catch (error) {
                pingDisplay.innerText = 'خطأ';
                statusDisplay.innerText = 'فشل الاتصال';
            }
        }
    </script>
</body>
</html>
